name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
  workflow_dispatch:

# Every job only reads the repository: nothing pushes, comments or publishes
# (upload-artifact uses the runtime token, not GITHUB_TOKEN). Without this
# block GITHUB_TOKEN gets the repository's default scope, which may include
# write. Widen it per job, not here, if a step ever needs more.
permissions:
  contents: read

# A new push to a PR cancels the run it supersedes, since only the latest
# commit's result matters there. Pushes to dev and master are never cancelled
# mid-run, so every run that starts on them finishes and reports. A PR's ref
# is refs/pull/<n>/merge, so PRs never share a group with each other or with
# a branch. GitHub keeps at most one pending run per group, so if several
# pushes land on a branch while a run is going, only the newest of them is
# queued to run next.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# LuaRocks is pinned rather than left to gh-actions-luarocks' default, so a
# Dependabot bump of that action cannot change it unannounced. It must be a
# release listed at https://luarocks.github.io/luarocks/releases/.
env:
  LUAROCKS_VERSION: "3.13.0"

jobs:
  lint:
    name: Luacheck
    runs-on: ubuntu-latest
    # Every job has a timeout, so a hung luarocks or busted is killed rather
    # than holding a runner for the 6-hour default. Each is about ten times
    # the job's usual run time, which leaves room for a cold cache (Lua and
    # the rocks built from source) on a slow shared runner. Luacheck usually
    # takes under a minute.
    timeout-minutes: 10
    steps:
      # Actions are pinned to full commit SHAs, with the release in a comment:
      # a tag can be moved to point at other code, a SHA cannot. That matters
      # most for the leafo actions, single-maintainer third-party code that
      # runs with the job token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes or otherwise uses git credentials, so the
          # token is not left behind in .git/config.
          persist-credentials: false

      - uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377 # v13.0.0
        with:
          luaVersion: "5.4"

      - uses: leafo/gh-actions-luarocks@35d062def313a7699a0d513e996bcf4352f05389 # v6.1.0
        with:
          luaRocksVersion: ${{ env.LUAROCKS_VERSION }}

      - name: Install the test toolchain
        # The rockspec's test_dependencies are the single declaration of the
        # dev toolchain; --prepare installs them without running the suite.
        run: luarocks test --prepare

      - name: Lint
        run: luacheck lua tests

  lint-workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    # Two pipx downloads and two quick scans; most of any delay is PyPI.
    timeout-minutes: 10
    env:
      # Both tools come from PyPI through pipx, which the runner image already
      # carries, so the versions are pinned here rather than in a third-party
      # action. actionlint-py wraps the upstream actionlint binary.
      ZIZMOR_VERSION: "1.30.1"
      ACTIONLINT_VERSION: "1.7.12.25"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: zizmor
        # Security audit: unpinned actions, credential persistence, template
        # injection, excessive permissions and the like. Offline mode, so it
        # needs no token; findings at the default persona fail the job.
        run: pipx run "zizmor==$ZIZMOR_VERSION" --offline .github

      - name: actionlint
        # Expression and type errors, plus shellcheck over every run: block
        # (shellcheck is preinstalled on the runner image). Runs even if
        # zizmor failed, so one push reports both.
        if: success() || failure()
        run: pipx run --spec "actionlint-py==$ACTIONLINT_VERSION" actionlint -color

  test:
    name: Tests (Lua ${{ matrix.lua }})
    runs-on: ubuntu-latest
    # Applies to each matrix leg on its own. A leg usually takes one to two
    # minutes, 5.4 the longest because it also runs the per-file specs and
    # the coverage report.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 5.1 and LuaJIT are what Neovim embeds, so they are the versions the
        # engine has to keep working on; 5.3 and 5.4 cover standalone use.
        lua: ["5.1", "5.3", "5.4", "luajit-2.1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377 # v13.0.0
        with:
          luaVersion: ${{ matrix.lua }}

      - uses: leafo/gh-actions-luarocks@35d062def313a7699a0d513e996bcf4352f05389 # v6.1.0
        with:
          luaRocksVersion: ${{ env.LUAROCKS_VERSION }}

      - name: Install the test toolchain
        # busted, luacov and luacheck all come from the rockspec's
        # test_dependencies, so the versions are declared in one place.
        run: luarocks test --prepare

      - name: Run tests
        # Shuffled so order dependencies between specs show up. The seed is
        # echoed so a red run can be reproduced with
        # `busted --shuffle --seed=<seed>`. TAP output is kept as an artifact
        # for anything that wants to parse the results. The Lua version comes
        # in through env rather than being expanded into the script, so the
        # shell never sees an expression's value as code.
        shell: bash
        env:
          LUA_VERSION: ${{ matrix.lua }}
        run: |
          set -o pipefail
          seed="${SEED:-$(date +%s)}"
          echo "Running with --shuffle --seed=$seed"
          busted --coverage --shuffle --seed="$seed" --output=TAP \
            | tee "busted-tap-$LUA_VERSION.txt"

      - name: Spec files in isolation
        # Load-order dependencies between spec files are version-independent,
        # so one Lua is enough; 5.4 is the development version. Runs after the
        # suite so a genuine failure is reported by the run above first.
        if: always() && matrix.lua == '5.4'
        run: make test-each-file

      - name: CLI example smoke test
        # The example is the only exercise of a bare `lua` with nothing but
        # LUA_PATH set -- no busted, no polyfills, no rockspec. It writes its
        # board to a temp path and cleans up after itself.
        run: make smoke

      - name: Performance bounds
        # A separate, uninstrumented run: the specs above are shuffled and
        # measured under luacov, whose per-line hook makes every timing
        # meaningless, so they skip themselves there. Budgets are calibrated
        # against a fixed workload measured in-process, which is what lets
        # the same figures hold across all four Lua versions; the tolerance
        # buys extra slack for a shared runner on a bad day.
        env:
          KANBAN_PERF_TOLERANCE: "2"
        run: busted tests/integration/performance_spec.lua

      - name: Upload TAP results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tap-lua-${{ matrix.lua }}
          path: busted-tap-${{ matrix.lua }}.txt
          if-no-files-found: warn

      - name: Coverage report
        # One report is enough; 5.4 is the development version.
        if: always() && matrix.lua == '5.4'
        run: |
          luacov
          # The summary table is the last section of the report.
          sed -n '/^Summary/,$p' luacov.report.out
